<svg viewBox="0 0 375 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="375" height="900" fill="#ffffff"/>
  <rect width="375" height="24" fill="#eeeeee"/>

  <!-- header -->
  <rect x="0" y="24" width="375" height="56" fill="#2c3e50"/>
  <text x="48" y="52" font-size="14" fill="#ffffff" font-weight="bold">Dictamen técnico</text>
  <text x="48" y="70" font-size="10" fill="#bdc3c7">SUA 04821-2026 · Paso 3 de 5</text>
  <text x="20" y="58" font-size="16" fill="#ffffff">←</text>

  <!-- offline indicator -->
  <rect x="290" y="36" width="65" height="20" rx="10" fill="#c0392b"/>
  <text x="322" y="50" font-size="8" fill="#fff" text-anchor="middle">SIN SEÑAL</text>

  <!-- step indicator (5 steps, this screen = step 3) -->
  <circle cx="35" cy="105" r="9" fill="#27ae60"/>
  <text x="35" y="108" font-size="8" fill="#fff" text-anchor="middle">✓</text>
  <text x="35" y="126" font-size="7" fill="#555" text-anchor="middle">Datos</text>
  <line x1="49" y1="105" x2="88" y2="105" stroke="#27ae60" stroke-width="2"/>

  <circle cx="102" cy="105" r="9" fill="#27ae60"/>
  <text x="102" y="108" font-size="8" fill="#fff" text-anchor="middle">✓</text>
  <text x="102" y="126" font-size="7" fill="#555" text-anchor="middle">Diagnóst.</text>
  <line x1="116" y1="105" x2="155" y2="105" stroke="#27ae60" stroke-width="2"/>

  <circle cx="169" cy="105" r="10" fill="#2c3e50"/>
  <text x="169" y="109" font-size="9" fill="#fff" text-anchor="middle">3</text>
  <text x="169" y="128" font-size="7" fill="#2c3e50" text-anchor="middle" font-weight="bold">Intervenc.</text>
  <line x1="184" y1="105" x2="223" y2="105" stroke="#ccc" stroke-width="2"/>

  <circle cx="237" cy="105" r="9" fill="#ddd"/>
  <text x="237" y="108" font-size="8" fill="#777" text-anchor="middle">4</text>
  <text x="237" y="126" font-size="7" fill="#999" text-anchor="middle">Adicional</text>
  <line x1="251" y1="105" x2="290" y2="105" stroke="#ccc" stroke-width="2"/>

  <circle cx="304" cy="105" r="9" fill="#ddd"/>
  <text x="304" y="108" font-size="8" fill="#777" text-anchor="middle">5</text>
  <text x="304" y="126" font-size="7" fill="#999" text-anchor="middle">Firma</text>

  <text x="24" y="150" font-size="10" fill="#888">Pasos 1-2 ya completados: Encabezado/ubicación y Diagnóstico (daño en vereda,</text>
  <text x="24" y="162" font-size="10" fill="#888">extracción, sin trabajo). Ver detalle de los 5 pasos en diseño-ui.md.</text>

  <!-- section title -->
  <text x="24" y="192" font-size="13" font-weight="bold" fill="#333">Trabajos de intervención</text>

  <!-- warning banner: extracción marcada -->
  <rect x="24" y="202" width="327" height="46" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="36" y="220" font-size="10" fill="#c0392b" font-weight="bold">⚠ Extracción marcada en el Paso 2</text>
  <text x="36" y="234" font-size="9" fill="#943126">Los trabajos aéreos y subterráneos se deshabilitan:</text>
  <text x="36" y="245" font-size="9" fill="#943126">no corresponde podar o intervenir raíces de un ejemplar a extraer (RF-46).</text>

  <!-- Bloque 3: trabajos subterráneos (disabled state) -->
  <text x="24" y="278" font-size="12" font-weight="bold" fill="#999">Bloque 3 — Trabajos en la parte subterránea</text>
  <rect x="24" y="286" width="327" height="112" rx="8" fill="#f4f4f4" stroke="#ddd"/>

  <rect x="36" y="298" width="16" height="16" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <text x="60" y="311" font-size="10" fill="#aaa">Corte vertical de raíces</text>
  <rect x="220" y="298" width="115" height="24" rx="4" fill="#eeeeee" stroke="#ddd"/>
  <text x="230" y="314" font-size="8" fill="#bbb">Distancia al borde (m)</text>

  <rect x="36" y="332" width="16" height="16" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <text x="60" y="345" font-size="10" fill="#aaa">Corte horizontal de raíces</text>

  <text x="36" y="362" font-size="8" fill="#bbb" font-style="italic">Deshabilitado — ver aviso arriba</text>

  <!-- Bloque 4: trabajos aéreos (disabled state, catalog of 12) -->
  <text x="24" y="418" font-size="12" font-weight="bold" fill="#999">Bloque 4 — Trabajos en la parte aérea</text>
  <rect x="24" y="426" width="327" height="190" rx="8" fill="#f4f4f4" stroke="#ddd"/>

  <rect x="36" y="438" width="16" height="16" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <text x="60" y="451" font-size="10" fill="#aaa">Poda de formación</text>

  <rect x="36" y="464" width="16" height="16" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <text x="60" y="477" font-size="10" fill="#aaa">Liberación de conductores eléctricos</text>

  <rect x="36" y="490" width="16" height="16" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <text x="60" y="503" font-size="10" fill="#aaa">Liberación de tránsito peatonal</text>

  <rect x="36" y="516" width="16" height="16" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <text x="60" y="529" font-size="10" fill="#aaa">Liberación de tránsito vehicular</text>

  <rect x="36" y="542" width="16" height="16" rx="3" fill="#e8e8e8" stroke="#ccc"/>
  <text x="60" y="555" font-size="10" fill="#aaa">Despeje de espacio aéreo privado</text>

  <text x="36" y="580" font-size="9" fill="#999" font-style="italic">+ 7 opciones más del catálogo (despeje de</text>
  <text x="36" y="592" font-size="9" fill="#999" font-style="italic">luminarias, equilibrio, raleo y limpieza, elevación</text>
  <text x="36" y="604" font-size="9" fill="#999" font-style="italic">de copa, reducción de altura/volumen, ramas</text>
  <text x="36" y="616" font-size="9" fill="#999" font-style="italic">en riesgo) — mismo estado deshabilitado.</text>

  <!-- helper text -->
  <text x="24" y="642" font-size="9" fill="#888">Si el usuario destilda "Extracción" volviendo al Paso 2, estos bloques se</text>
  <text x="24" y="654" font-size="9" fill="#888">reactivan automáticamente y pueden completarse con selección múltiple.</text>

  <!-- fixed bottom actions -->
  <rect x="0" y="836" width="375" height="64" fill="#ffffff" stroke="#eee"/>
  <rect x="24" y="852" width="150" height="32" rx="8" fill="#ffffff" stroke="#2c3e50"/>
  <text x="99" y="873" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold">ATRÁS</text>
  <rect x="201" y="852" width="150" height="32" rx="8" fill="#2c3e50"/>
  <text x="276" y="873" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">SIGUIENTE</text>
</svg>
