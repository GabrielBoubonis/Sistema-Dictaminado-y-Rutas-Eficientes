<svg viewBox="0 0 375 872" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="375" height="872" fill="#ffffff"/>
  <rect width="375" height="24" fill="#eeeeee"/>

  <rect x="0" y="24" width="375" height="56" fill="#2c3e50"/>
  <text x="48" y="58" font-size="16" fill="#ffffff" font-weight="bold">Generar ruta</text>
  <text x="20" y="58" font-size="16" fill="#ffffff">←</text>

  <text x="24" y="105" font-size="10" fill="#888">Combiná los criterios que necesites. El modo de desplazamiento es obligatorio.</text>

  <!-- sección distrito -->
  <rect x="24" y="120" width="327" height="70" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="142" font-size="12" font-weight="bold" fill="#333">Distrito</text>
  <text x="300" y="142" font-size="9" fill="#999" text-anchor="end">opcional</text>
  <rect x="40" y="150" width="295" height="28" rx="6" fill="#ffffff" stroke="#bbb"/>
  <text x="52" y="169" font-size="10" fill="#555">Sin filtrar por distrito ▾</text>

  <!-- sección prioridad -->
  <rect x="24" y="200" width="327" height="94" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="222" font-size="12" font-weight="bold" fill="#333">Cantidad por prioridad</text>
  <rect x="40" y="232" width="93" height="46" rx="8" fill="#fdecea" stroke="#e74c3c"/>
  <text x="86" y="250" font-size="9" fill="#c0392b" text-anchor="middle">Alta</text>
  <text x="86" y="268" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">3</text>
  <rect x="141" y="232" width="93" height="46" rx="8" fill="#fef5e7" stroke="#f39c12"/>
  <text x="187" y="250" font-size="9" fill="#c0790a" text-anchor="middle">Media</text>
  <text x="187" y="268" font-size="14" fill="#c0790a" text-anchor="middle" font-weight="bold">4</text>
  <rect x="242" y="232" width="93" height="46" rx="8" fill="#eafaf1" stroke="#27ae60"/>
  <text x="288" y="250" font-size="9" fill="#1e8449" text-anchor="middle">Baja</text>
  <text x="288" y="268" font-size="14" fill="#1e8449" text-anchor="middle" font-weight="bold">1</text>

  <!-- sección zona en mapa -->
  <rect x="24" y="304" width="327" height="250" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="326" font-size="12" font-weight="bold" fill="#333">Zona en el mapa</text>
  <text x="300" y="326" font-size="9" fill="#999" text-anchor="end">opcional</text>
  <rect x="40" y="334" width="295" height="200" rx="8" fill="#eef3f5" stroke="#bbb"/>
  <text x="187" y="440" font-size="11" fill="#888" text-anchor="middle">🗺  Tocar para dibujar una zona</text>
  <circle cx="150" cy="400" r="4" fill="#e74c3c"/>
  <circle cx="200" cy="420" r="4" fill="#e74c3c"/>
  <circle cx="230" cy="380" r="4" fill="#e74c3c"/>

  <!-- sección modo de desplazamiento -->
  <rect x="24" y="570" width="327" height="70" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="40" y="592" font-size="12" font-weight="bold" fill="#333">Modo de desplazamiento</text>
  <text x="300" y="592" font-size="9" fill="#c0392b" text-anchor="end">obligatorio</text>
  <rect x="40" y="600" width="143" height="30" rx="15" fill="#2c3e50"/>
  <text x="111" y="620" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">🚶  A pie</text>
  <rect x="192" y="600" width="143" height="30" rx="15" fill="#ffffff" stroke="#bbb"/>
  <text x="263" y="620" font-size="10" fill="#555" text-anchor="middle">🚗  Vehículo</text>

  <!-- resumen -->
  <rect x="24" y="654" width="327" height="40" rx="8" fill="#eaf2f8"/>
  <text x="187" y="678" font-size="11" fill="#2c3e50" text-anchor="middle">8 solicitudes cumplen estos criterios</text>

  <!-- botón principal -->
  <rect x="24" y="710" width="327" height="48" rx="8" fill="#2c3e50"/>
  <text x="187" y="739" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">GENERAR RUTA</text>

  <!-- modal de confirmación -->
  <rect x="0" y="0" width="375" height="872" fill="#000000" opacity="0.35"/>
  <rect x="30" y="652" width="315" height="210" rx="12" fill="#ffffff"/>
  <text x="187" y="692" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">Confirmar ruta</text>
  <text x="187" y="717" font-size="11" fill="#555" text-anchor="middle">Se reservarán 8 solicitudes</text>
  <text x="187" y="734" font-size="11" fill="#555" text-anchor="middle">para tu ruta de hoy, a pie.</text>
  <text x="187" y="756" font-size="9" fill="#888" text-anchor="middle">Ninguna estará disponible</text>
  <text x="187" y="770" font-size="9" fill="#888" text-anchor="middle">para otros ingenieros.</text>
  <rect x="50" y="790" width="120" height="40" rx="8" fill="#ffffff" stroke="#999"/>
  <text x="110" y="814" font-size="11" fill="#555" text-anchor="middle">Cancelar</text>
  <rect x="200" y="790" width="120" height="40" rx="8" fill="#2c3e50"/>
  <text x="260" y="814" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Confirmar</text>
</svg>
