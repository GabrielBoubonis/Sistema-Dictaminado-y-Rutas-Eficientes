<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="375" height="812" fill="#ffffff"/>
  <rect width="375" height="24" fill="#eeeeee"/>

  <!-- header -->
  <rect x="0" y="24" width="375" height="56" fill="#2c3e50"/>
  <text x="48" y="52" font-size="14" fill="#ffffff" font-weight="bold">Dictamen técnico</text>
  <text x="48" y="70" font-size="10" fill="#bdc3c7">SUA 04821-2026 · Paso 5 de 5</text>
  <text x="20" y="58" font-size="16" fill="#ffffff">←</text>

  <!-- offline indicator -->
  <rect x="290" y="36" width="65" height="20" rx="10" fill="#c0392b"/>
  <text x="322" y="50" font-size="8" fill="#fff" text-anchor="middle">SIN SEÑAL</text>

  <!-- banner de error de guardado local -->
  <rect x="24" y="100" width="327" height="92" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="36" y="122" font-size="11" fill="#c0392b" font-weight="bold">⚠ No se pudo guardar el dictamen en el dispositivo</text>
  <text x="36" y="140" font-size="9" fill="#943126">El almacenamiento local del captor está lleno o no</text>
  <text x="36" y="152" font-size="9" fill="#943126">disponible. El dictamen no quedó firmado todavía.</text>
  <text x="36" y="170" font-size="9" fill="#943126">Tus datos cargados en el formulario NO se perdieron:</text>
  <text x="36" y="182" font-size="9" fill="#943126">podés reintentar guardar sin volver a completarlos.</text>

  <!-- botón reintentar -->
  <rect x="24" y="204" width="327" height="44" rx="8" fill="#2c3e50"/>
  <text x="187" y="231" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">REINTENTAR GUARDADO</text>

  <!-- fondo del formulario atenuado -->
  <text x="24" y="280" font-size="12" font-weight="bold" fill="#999">Observaciones y firma</text>
  <rect x="24" y="290" width="327" height="90" rx="8" fill="#f4f4f4" stroke="#ddd"/>
  <text x="36" y="310" font-size="9" fill="#bbb">Nivel de prioridad, observaciones y resumen</text>
  <text x="36" y="324" font-size="9" fill="#bbb">de los 4 pasos anteriores — se conservan intactos</text>
  <text x="36" y="338" font-size="9" fill="#bbb">mientras se resuelve el error de guardado.</text>

  <text x="24" y="420" font-size="9" fill="#999" font-style="italic">Caso de borde de HU-09: hasta ahora solo estaba</text>
  <text x="24" y="432" font-size="9" fill="#999" font-style="italic">documentado el guardado offline exitoso (caso feliz).</text>
  <text x="24" y="444" font-size="9" fill="#999" font-style="italic">Este estado cubre la falla de ese guardado local.</text>

  <!-- fixed bottom actions -->
  <rect x="0" y="748" width="375" height="64" fill="#ffffff" stroke="#eee"/>
  <rect x="24" y="764" width="150" height="32" rx="8" fill="#ffffff" stroke="#2c3e50"/>
  <text x="99" y="785" font-size="12" fill="#2c3e50" text-anchor="middle" font-weight="bold">ATRÁS</text>
  <rect x="201" y="764" width="150" height="32" rx="8" fill="#cccccc"/>
  <text x="276" y="785" font-size="12" fill="#888888" text-anchor="middle" font-weight="bold">FIRMAR</text>
</svg>
