<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="375" height="812" fill="#ffffff"/>
  <rect width="375" height="24" fill="#eeeeee"/>

  <!-- pantalla de fondo: Paso 5 (Firma), atenuada -->
  <rect x="0" y="24" width="375" height="56" fill="#2c3e50"/>
  <text x="48" y="52" font-size="14" fill="#ffffff" font-weight="bold">Dictamen técnico</text>
  <text x="48" y="70" font-size="10" fill="#bdc3c7">SUA 04821-2026 · Paso 5 de 5</text>
  <text x="20" y="58" font-size="16" fill="#ffffff">←</text>

  <text x="24" y="120" font-size="12" font-weight="bold" fill="#999">Observaciones y firma</text>
  <rect x="24" y="130" width="327" height="90" rx="8" fill="#f4f4f4" stroke="#ddd"/>
  <text x="36" y="150" font-size="9" fill="#bbb">Nivel de prioridad, observaciones y resumen</text>
  <text x="36" y="164" font-size="9" fill="#bbb">de los 4 pasos anteriores (contenido atenuado</text>
  <text x="36" y="178" font-size="9" fill="#bbb">detrás del modal de verificación).</text>

  <!-- overlay modal -->
  <rect x="0" y="0" width="375" height="812" fill="#000000" opacity="0.4"/>

  <rect x="28" y="300" width="319" height="300" rx="12" fill="#ffffff"/>

  <!-- icono huella -->
  <circle cx="187" cy="356" r="30" fill="#eaf2e3"/>
  <text x="187" y="366" font-size="24" text-anchor="middle">🔒</text>

  <text x="187" y="412" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Verificá tu identidad</text>
  <text x="187" y="434" font-size="10" fill="#666" text-anchor="middle">Para firmar este dictamen necesitamos</text>
  <text x="187" y="448" font-size="10" fill="#666" text-anchor="middle">confirmar que sos vos (RF-51).</text>

  <!-- botón biometría -->
  <rect x="52" y="470" width="271" height="48" rx="10" fill="#2c3e50"/>
  <text x="187" y="499" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">👆 Usar huella / Face ID</text>

  <text x="187" y="534" font-size="9" fill="#999" text-anchor="middle">Verificación biométrica del dispositivo (WebAuthn)</text>

  <!-- cancelar -->
  <rect x="52" y="552" width="271" height="40" rx="10" fill="#ffffff" stroke="#999"/>
  <text x="187" y="577" font-size="11" fill="#555" text-anchor="middle">Cancelar</text>

  <text x="187" y="610" font-size="9" fill="#aaa" text-anchor="middle" font-style="italic">Si se cancela o falla, el dictamen no se firma ni se</text>
  <text x="187" y="622" font-size="9" fill="#aaa" text-anchor="middle" font-style="italic">guarda; los datos cargados en el formulario se conservan.</text>
</svg>
